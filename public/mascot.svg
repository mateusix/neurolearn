<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fundo Branco -->
  <rect width="400" height="400" fill="#ffffff" />

  <!-- Corpo do Mascote (Azul Pastel) -->
  <rect x="75" y="75" width="250" height="250" rx="45" ry="45" fill="#88d8e6" />

  <!-- Olho Esquerdo -->
  <circle cx="150" cy="180" r="22" fill="#12181f" />
  <circle cx="157" cy="173" r="7" fill="#ffffff" />

  <!-- Olho Direito -->
  <circle cx="250" cy="180" r="22" fill="#12181f" />
  <circle cx="257" cy="173" r="7" fill="#ffffff" />

  <!-- Sobrancelha Esquerda -->
  <path d="M 130 145 Q 150 132 170 145" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" />

  <!-- Sobrancelha Direita -->
  <path d="M 230 145 Q 250 132 270 145" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" />

  <!-- Sorriso -->
  <path d="M 175 220 Q 200 240 225 220" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" />
</svg>
